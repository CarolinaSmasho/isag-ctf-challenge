version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.simple
    ports:
      - "8080:80"
    volumes:
      - ./app/views:/var/www/html
    environment:
      - FLAG=${FLAG}
    networks:
      - ctf-network
    # Force x86_64 architecture for consistency
    platform: linux/amd64

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot-debian
    working_dir: /app
    volumes:
      - ./.env:/app/.env
    command: node mybot2.js
    depends_on:
      - web
    environment:
      - FLAG=${FLAG}
      - DOCKER_ENV=true
    networks:
      - ctf-network
    # Force x86_64 architecture for consistency
    platform: linux/amd64

networks:
  ctf-network:
    driver: bridge